<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VibeApp</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-weight: 700;
      font-size: 12px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      transition: transform 0.1s ease, filter 0.2s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .counter {
      margin-top: 16px;
      font-size: 14px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">VibeAPK Ready</div>
    <h1>It Works!</h1>
    <p>Your web application is running inside a high-performance native Android WebView.</p>
    <button class="btn" id="clickBtn">Test Interactivity</button>
    <div class="counter" id="counterText">Clicks: 0</div>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('vibe_clicks') || '0', 10);
    const counterText = document.getElementById('counterText');
    const clickBtn = document.getElementById('clickBtn');

    function update() {
      counterText.textContent = `Clicks: ${count}`;
      localStorage.setItem('vibe_clicks', count.toString());
    }

    update();

    clickBtn.addEventListener('click', () => {
      count++;
      update();
    });
  </script>
</body>
</html>
